---
# Nextcloud PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-pvc
  namespace: privacy-stack
spec:
  accessModes:
    - ReadWriteMany  # NFS supports ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: nfs-client

---
# Nextcloud Database PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-db-pvc
  namespace: privacy-stack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn

---
# Nextcloud Redis PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-redis-pvc
  namespace: privacy-stack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn

---
# Nextcloud Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-db
  namespace: privacy-stack
  labels:
    app: nextcloud-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-db
  template:
    metadata:
      labels:
        app: nextcloud-db
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "changeme123"  # Change this password!
        - name: MYSQL_DATABASE
          value: "nextcloud"
        - name: MYSQL_USER
          value: "nextcloud"
        - name: MYSQL_PASSWORD
          value: "changeme123"  # Change this password!
        - name: MYSQL_CHARSET
          value: "utf8mb4"
        - name: MYSQL_COLLATION
          value: "utf8mb4_unicode_ci"
        volumeMounts:
        - name: nextcloud-db-storage
          mountPath: "/var/lib/mysql"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: nextcloud-db-storage
        persistentVolumeClaim:
          claimName: nextcloud-db-pvc

---
# Nextcloud Database Service
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-db
  namespace: privacy-stack
  labels:
    app: nextcloud-db
spec:
  selector:
    app: nextcloud-db
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
    protocol: TCP
  type: ClusterIP

---
# Nextcloud Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis
  namespace: privacy-stack
  labels:
    app: nextcloud-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-redis
  template:
    metadata:
      labels:
        app: nextcloud-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - --requirepass
        - "changeme123"  # Change this password!
        - --appendonly
        - "yes"
        volumeMounts:
        - name: nextcloud-redis-storage
          mountPath: "/data"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: nextcloud-redis-storage
        persistentVolumeClaim:
          claimName: nextcloud-redis-pvc

---
# Nextcloud Redis Service
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis
  namespace: privacy-stack
  labels:
    app: nextcloud-redis
spec:
  selector:
    app: nextcloud-redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  type: ClusterIP

---
# Nextcloud Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: privacy-stack
  labels:
    app: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
      - name: nextcloud
        image: nextcloud:27
        ports:
        - containerPort: 80
          name: http
        env:
        # Database configuration
        - name: MYSQL_HOST
          value: "nextcloud-db"
        - name: MYSQL_DATABASE
          value: "nextcloud"
        - name: MYSQL_USER
          value: "nextcloud"
        - name: MYSQL_PASSWORD
          value: "changeme123"
        
        # Redis configuration
        - name: REDIS_HOST
          value: "nextcloud-redis"
        - name: REDIS_HOST_PASSWORD
          value: "changeme123"
        
        # Application settings
        - name: NEXTCLOUD_ADMIN_USER
          value: "admin"
        - name: NEXTCLOUD_ADMIN_PASSWORD
          value: "changeme123"  # Change this password!
        - name: NEXTCLOUD_TRUSTED_DOMAINS
          value: "nextcloud.local"
        - name: NEXTCLOUD_OVERWRITEPROTOCOL
          value: "https"
        
        # Performance settings
        - name: APACHE_DISABLE_REWRITE_IP
          value: "1"
        
        volumeMounts:
        - name: nextcloud-storage
          mountPath: "/var/www/html"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: nextcloud-storage
        persistentVolumeClaim:
          claimName: nextcloud-pvc

---
# Nextcloud Service
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: privacy-stack
  labels:
    app: nextcloud
spec:
  selector:
    app: nextcloud
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP