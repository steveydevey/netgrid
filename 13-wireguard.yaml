---
# WireGuard PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wireguard-pvc
  namespace: privacy-stack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn

---
# WireGuard ConfigMap for server configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: wireguard-config
  namespace: privacy-stack
data:
  wg0.conf: |
    [Interface]
    PrivateKey = YOUR_PRIVATE_KEY_HERE  # Replace with actual private key
    Address = 10.0.0.1/24
    ListenPort = 51820
    PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
    PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

    # Client configurations (add peers here)
    # [Peer]
    # PublicKey = CLIENT_PUBLIC_KEY_HERE
    # AllowedIPs = 10.0.0.2/32

---
# WireGuard Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: privacy-stack
  labels:
    app: wireguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      containers:
      - name: wireguard
        image: linuxserver/wireguard:latest
        ports:
        - containerPort: 51820
          name: wireguard
          protocol: UDP
        env:
        # Application settings
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "UTC"
        - name: SERVERURL
          value: "your-server-ip-or-domain.com"  # Replace with your server's IP or domain
        - name: SERVERPORT
          value: "51820"
        - name: PEERS
          value: "1"  # Number of client peers to generate
        - name: PEERDNS
          value: "1.1.1.1"
        - name: INTERNAL_SUBNET
          value: "10.0.0.0"
        
        # Security settings
        - name: ALLOWEDIPS
          value: "0.0.0.0/0"  # Allow all traffic through VPN (change as needed)
        
        volumeMounts:
        - name: wireguard-storage
          mountPath: "/config"
        - name: wireguard-config
          mountPath: "/config/wg0.conf"
          subPath: wg0.conf
        - name: lib-modules
          mountPath: "/lib/modules"
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        securityContext:
          privileged: true  # Required for WireGuard kernel module access
          capabilities:
            add:
            - NET_ADMIN
            - SYS_MODULE
      volumes:
      - name: wireguard-storage
        persistentVolumeClaim:
          claimName: wireguard-pvc
      - name: wireguard-config
        configMap:
          name: wireguard-config
      - name: lib-modules
        hostPath:
          path: "/lib/modules"
      hostNetwork: true  # Required for WireGuard to bind to host network

---
# WireGuard Service
apiVersion: v1
kind: Service
metadata:
  name: wireguard
  namespace: privacy-stack
  labels:
    app: wireguard
spec:
  selector:
    app: wireguard
  ports:
  - name: wireguard
    port: 51820
    targetPort: 51820
    protocol: UDP
  type: LoadBalancer  # Use LoadBalancer to expose WireGuard port